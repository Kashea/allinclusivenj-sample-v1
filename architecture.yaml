research:
  source_sitemaps:
    index: "https://allinclusivenj.com/sitemap_index.xml"
    page: "https://allinclusivenj.com/page-sitemap.xml"
    posts: "https://allinclusivenj.com/post-sitemap.xml"
    wordpress_pattern_collection: "https://allinclusivenj.com/gblocks_pattern_collections-sitemap.xml"
    wordpress_authors: "https://allinclusivenj.com/author-sitemap.xml"
  competitors_reviewed:
    - name: "Skydell Contracting"
      url: "https://www.skydell.com/"
      observed_strengths: ["project photography", "specialist kitchen and bath positioning", "prominent phone CTA", "detailed local service-area list"]
      response: "Use a similarly visible proof-and-contact path while differentiating with the client's broader project mix, woman-owned leadership, and verified awards."
    - name: "Symmetrical Wolf"
      url: "https://www.symmetricalwolf.com/county/somerset-county-nj/branchburg-nj"
      observed_strengths: ["Branchburg-specific landing page", "step-by-step inquiry journey", "trust signals", "owner introduction"]
      response: "Make location relevance, named process steps, and leadership visible; do not reuse its claims, offer, warranty, reviews, or copy."
    - name: "Bellari Home Remodeling"
      url: "https://www.bellarinj.com/"
      observed_strengths: ["long operating history", "showroom and product-led services", "large project and testimonial sections", "promotional CTA modules"]
      response: "Position All Inclusive around its own service range and personal project coordination; do not imply a showroom or product lines that have not been verified."
    - name: "Magnolia Home Remodeling Group"
      url: "https://magnoliahomeremodeling.com/service-areas/somerset-county-nj/branchburg/general-contractor/"
      observed_strengths: ["town/service landing pages", "wide interior and exterior scope"]
      response: "Retain valuable legacy local URLs but replace repetitive keyword copy with useful, accurate location-specific information."

stack:
  framework: "Next.js 16 App Router"
  language: "TypeScript, strict mode"
  ui: "React 19 and Tailwind CSS 4"
  cms: "Sanity Content Lake and embedded Sanity Studio"
  next_sanity: "next-sanity 13 or later; use the current stable release compatible with Next.js 16"
  rich_text: "Sanity Portable Text rendered with @portabletext/react"
  form_leads: "PostgreSQL through Drizzle ORM; separate from editorial CMS content"
  media: "Sanity image assets with focal-point cropping and descriptive alt text"
  deployment: "Node-compatible Next.js hosting; production origin configured in Sanity CORS"
  rendering:
    marketing_pages: "Server Components with static generation or ISR"
    content_refresh: "Tag-based revalidation or next-sanity Live Content API after project credentials and tokens are configured"
    draft_preview: "Next.js Draft Mode, protected by a server-only Sanity read token"
    studio: "Embedded at /studio; disable indexing and keep access behind Sanity authentication"

