    - { source: "/author/kyleyondermooncreative-com/", destination: "/news/", status: 301, reason: "Review archive links before redirecting; retain byline credit where contractually required." }
    - { source: "/gblocks_pattern_collections/local-patterns/", destination: null, status: 410, reason: "WordPress internal block-pattern collection, not a public marketing page." }

sanity:
  studio_base_path: "/studio"
  environment:
    public:
      - "NEXT_PUBLIC_SANITY_PROJECT_ID"
      - "NEXT_PUBLIC_SANITY_DATASET"
      - "NEXT_PUBLIC_SANITY_STUDIO_URL"
    server_only:
      - "SANITY_API_READ_TOKEN"
      - "SANITY_REVALIDATE_SECRET"
  document_models:
    siteSettings:
      singleton: true
      fields: ["brandName", "logo", "phone", "email", "registrationNumbers", "serviceAreaSummary", "socialLinks", "footerNote", "defaultSeo"]
    homePage:
      singleton: true
      fields: ["eyebrow", "headline", "intro", "heroImage", "heroImageAlt", "primaryCta", "secondaryCta", "proofPoints", "featuredServices", "featuredProjects", "testimonialReferences", "featuredArticles", "seo"]
    service:
      fields: ["title", "slug", "shortDescription", "heroImage", "heroAlt", "intro", "benefits", "scopeItems", "processSteps", "faq", "projectReferences", "testimonialReferences", "serviceAreaReferences", "seo", "published"]
    project:
      fields: ["title", "slug", "serviceCategory", "locationLabel", "summary", "challenge", "approach", "result", "gallery", "coverImage", "altText", "completionDate", "featured", "seo", "approvedForMarketing"]
    article:
      fields: ["title", "slug", "excerpt", "heroImage", "heroAlt", "bodyPortableText", "authorReference", "categories", "publishedAt", "updatedAt", "relatedServices", "seo", "legacyUrl"]
    award:
      fields: ["title", "year", "awardingOrganization", "projectLabel", "image", "altText", "sourceUrl", "verified"]
    testimonial:
      fields: ["quote", "attribution", "source", "sourceUrl", "serviceReference", "permissionConfirmed", "featured"]
    serviceArea:
      fields: ["name", "slug", "county", "region", "intro", "serviceReferences", "localProof", "faq", "seo", "coverageConfirmed"]
    person:
      fields: ["name", "role", "portrait", "portraitAlt", "bio", "credentials", "socialLinks"]
    legalPage:
      fields: ["title", "slug", "bodyPortableText", "lastReviewedAt", "reviewedBy", "seoNoIndex"]
    careerPage:
      fields: ["intro", "openRoles", "applicationEmail", "benefits", "seo"]
  reusable_objects:
    seo: ["metaTitle", "metaDescription", "canonicalUrl", "socialImage", "noIndex"]
    cta: ["label", "href", "style"]
    faqItem: ["question", "answer"]
    galleryItem: ["image", "alt", "caption", "category"]
  editorial_rules:
    - "Keep facts, awards, locations, license/registration language, and years-of-experience claims source-backed and owner-approved."
    - "Never publish a testimonial without attribution permission and a traceable source."
    - "Every Sanity image must have descriptive alt text; do not preserve keyword-stuffed alt text."
    - "Use the client's own project photography; confirm usage rights and project/location labels before publishing."
    - "Legal policy wording is maintained only after review by the client's legal adviser."

content_delivery:
  client: "next-sanity createClient in server-only module; published content uses CDN and a pinned API version"
  query_strategy: "Typed GROQ constants; fetch only fields needed by each route; keep local typed fixtures as a safe preview fallback until project ID and dataset are configured."
  cache_strategy: "Static/ISR for public pages; on-demand content revalidation after publishing; Draft Mode is uncached and server-token protected."
  image_strategy: "Sanity image URL builder with responsive width, quality, hotspot crop, and per-image alt; import original WordPress media only after ownership/permission check."
  rendering:
    homepage: "Server Component; CMS homePage, then approved local fallback"
    services_and_locations: "Dynamic route from published service/landingPage documents with generateStaticParams for known slugs"
    articles: "Published article documents only; preserve current /news/[slug]/ URL shape"
    studio: "NextStudio under /studio; Studio schema and route are excluded from public sitemap"

postgresql:
  responsibility: "Store private lead inquiries only; Sanity remains the source of truth for public/editorial content."
  drizzle_table:
    name: "contact_leads"
    columns:
      - "id: serial primary key"
      - "name: varchar(120), required"
      - "email: varchar(254), required"
      - "phone: varchar(40), optional"
      - "projectType: varchar(80), required"
      - "location: varchar(120), optional"
      - "budget: varchar(80), optional"
      - "timeline: varchar(80), optional"
      - "hasPlans: boolean, nullable"
      - "message: text, optional"
      - "consent: boolean, required"
      - "sourcePath: varchar(300), optional"
      - "createdAt: timestamptz, default now"
  api:
    endpoint: "POST /api/leads"
    protections: ["server-side validation", "honeypot", "payload length limits", "consent required", "no secrets in client", "add rate limit and CAPTCHA/Turnstile before public launch"]
    post_submit: "Return a clear success state; production should additionally notify the client via a server-side email provider."

seo:
  canonical_policy: "Keep current high-value public slugs as canonical; trailing slash convention is consistent."
  metadata: "Unique title/description per route, social image, canonical URL, Open Graph, Twitter metadata."
  structured_data:
    - "GeneralContractor or HomeAndConstructionBusiness only with verified facts"
    - "Organization identity and service catalog"
    - "BreadcrumbList on service, project, article, and location routes"
    - "Article on editorial pages"
  caution: "Do not add self-serving LocalBusiness review markup for first-party testimonials; do not publish unverified prices, star ratings, or service-area claims."
  technical:
    sitemap: "Generate only published, canonical, indexable pages and articles."
    robots: "Disallow /api/ and /studio/; allow public content."
    redirects: "Preserve existing service, portfolio, news, and legal URLs; map WordPress-only archives according to legacy_routes."

accessibility_and_design:
  visual_direction: "Warm, editorial, confident residential design-build brand; ivory surfaces, deep evergreen, muted brass accents, large project photography, generous spacing, readable serif display type."
  principles:
    - "Mobile-first layout and navigation"
    - "Semantic landmarks and one clear h1 per page"
    - "Visible keyboard focus and skip link"
    - "Labels and helpful error messaging for every form field"
    - "Accessible contrast, reduced-motion support, descriptive link labels"
    - "Gallery images lazy-loaded with explicit dimensions and alt text"
    - "No auto-rotating carousel required for core content"

migration:
  preserve_urls: true
  phase_1:
    - "Export both WordPress page and post sitemaps, media metadata, SEO metadata, page bodies, redirects, and form fields."
    - "Import service pages, company story, awards, contact details, portfolio images, and eight discovered articles into Sanity."
    - "Rebuild all high-value routes and compare rendered pages, image assets, links, and metadata against the crawl."
  phase_2:
    - "Write redirects for non-canonical archives and any approved slug changes."
    - "Connect the Sanity project, set public project/dataset variables and server-side viewer token, then test published and draft perspectives."
    - "Enable consent-compliant analytics and server-side lead notifications after privacy review."
  acceptance_checks:
    - "Every sitemap URL is mapped to a kept route, a reviewed redirect, or an intentional 410."
    - "All project images have confirmed rights, accurate project labels, and useful alt text."
    - "Contact submission validates, persists through Drizzle, and displays success/error states."
    - "Public routes build without Sanity secrets; /studio is not indexable."
    - "Mobile navigation, service links, filters, form, privacy links, sitemap, and robots routes work."
    - "No placeholder legal text, fabricated awards, fabricated reviews, unsupported prices, or unsupported service claims remain." 
