    - { path: "/robots.txt", type: "technical", source: "Next.js metadata route; block /studio/ and /api/" }
    - { path: "/studio/[[...tool]]/", type: "cms", source: "embedded Sanity Studio; noindex" }
  article_slugs_from_post_sitemap:
    - "second-story-addition-vs-moving-to-a-bigger-home-whats-the-right-choice-for-you"
    - "renovate-or-move-the-3-factors-to-consider-all-inclusive-construction"
