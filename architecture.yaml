  purpose: "Rebuild the residential remodeling and construction marketing site with Next.js and Sanity."
  status: "research-backed implementation blueprint"
  research_note: "Sitemap and public pages were reviewed; see docs/source-audit.md for source URLs, competitor notes, caveats, and content corrections."
  business_facts:
    public_name: "All Inclusive Construction & Building"
    legal_name_from_structured_data: "All Inclusive Construction and Building LLC"
    headquarters: "Branchburg, New Jersey"
    primary_service_region: "Somerset County and nearby Central New Jersey communities"
    phone: "+1-732-484-9008"
    email: "allinclusivenj@gmail.com"
    nj_registration: "13VH09398200"
    pa_registration: "PA182975"
    insurance_claim: "The source site states the business is fully insured in NJ and PA; reconfirm before launch."
