      - { label: "About", href: "/about/" }
      - { label: "Insights", href: "/news/" }
      - { label: "Contact", href: "/contact/" }
    persistent_conversion: "Request a consultation"
    phone: "+1-732-484-9008"
  routes:
    - { path: "/", type: "home", cms: "homePage", seo: "local business landing page" }
    - { path: "/kitchen-remodels/", type: "service", cms: "service", source: "sitemap" }
    - { path: "/bathroom-remodels/", type: "service", cms: "service", source: "sitemap" }
    - { path: "/residential-additions/", type: "service", cms: "service", source: "sitemap" }
    - { path: "/decks/", type: "service", cms: "service", source: "sitemap" }
    - { path: "/your-trusted-general-contractor-in-central-nj/", type: "service-area", cms: "landingPage", source: "sitemap" }
    - { path: "/portfolio/", type: "project-index", cms: "project", source: "sitemap" }
    - { path: "/projects/[slug]/", type: "project-detail", cms: "project", status: "recommended expansion; publish only when project facts and approved photos exist" }
    - { path: "/about/", type: "company", cms: "aboutPage", source: "sitemap" }
    - { path: "/awards/", type: "awards", cms: "award", source: "sitemap" }
    - { path: "/careers/", type: "careers", cms: "careerPage", source: "sitemap" }
    - { path: "/contact/", type: "lead-form", cms: "siteSettings", source: "sitemap" }
    - { path: "/news/", type: "article-index", cms: "article", source: "sitemap" }
    - { path: "/news/[slug]/", type: "article-detail", cms: "article", source: "post-sitemap" }
    - { path: "/home-remodeling-in-branchburg/", type: "service-area", cms: "landingPage", source: "sitemap" }
    - { path: "/home-remodeling-home-improvement-services-in-somerset-county-nj/", type: "service-area", cms: "landingPage", source: "sitemap" }
    - { path: "/accessibility-statement/", type: "legal", cms: "legalPage", source: "sitemap", note: "Preserve route; reconcile the phone number and re-review accessibility wording." }
    - { path: "/privacy-policy/", type: "legal", cms: "legalPage", source: "sitemap", note: "Source response did not expose complete policy body; import verified legal copy, do not invent it." }
    - { path: "/terms-conditions/", type: "legal", cms: "legalPage", source: "sitemap", note: "Source response did not expose complete terms body; import verified legal copy, do not invent it." }
    - { path: "/cookie-policy/", type: "legal", cms: "legalPage", source: "sitemap", note: "Source response did not expose complete cookie policy body; import verified legal copy, do not invent it." }
